name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar projeto
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar a formatação
        run: npm run format:check

      - name: Executar a análise estática
        run: npm run lint

      - name: Construir o projeto
        run: npm run build

      - name: Executar os testes com cobertura
        run: npm run test:coverage

      - name: Disponibilizar o relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ github.sha }}
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 14
